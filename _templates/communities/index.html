<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${domain_name}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu">
    <style>
        body {
            font-family: Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
            margin: 40px;
            text-align: center;
        }

        [hidden] {
            display: none !important;
        }

        a {
            color: #5009DC;
            text-decoration: none;
        }

        a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid #1d4ed8;
            outline-offset: 3px;
        }

        .site-logo {
            height: auto;
            max-height: 164px;
            max-width: calc(100% - 42px);
            border: 1px solid lightgrey;
            border-radius: 20px;
            padding: 12px;
            margin: 8px;
        }

        h1 {
            margin: 0 8px 8px;
            font-size: 40px;
            font-weight: normal;
            color: #8c8c8c;
        }

        .subtitle {
            margin: 0 0 16px;
            font-size: 20px;
            color: #8c8c8c;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .search-container {
            margin-bottom: 30px;
            color: grey;
        }

        #filter_all {
            box-sizing: border-box;
            font-family: inherit;
            font-size: 16px;
            height: 36px;
            width: 320px;
            max-width: 100%;
            padding: 4px 8px;
        }

        #summary_all {
            display: block;
            margin-top: 8px;
            font-size: 14px;
        }

        .tab {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 4px;
        }

        .tab button {
            background-color: transparent;
            border: none;
            cursor: pointer;
            padding: 11px 16px;
            margin-bottom: -1px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            border-radius: 8px 8px 0 0;
            transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
        }

        .tab button:hover {
            color: #1f2937;
            background-color: #f3f4f6;
        }

        .tab button.active {
            color: #1d4ed8;
            border-bottom-color: #1d4ed8;
        }

        .community-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 300px));
            justify-content: center;
            gap: 20px;
            margin: 20px auto;
            max-width: 1280px;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 18px 14px;
            border: 1px solid lightgrey;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2), 0 3px 10px 0 rgba(0, 0, 0, 0.19);
            border-radius: 12px;
            background-color: white;
            overflow-wrap: anywhere;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
            min-height: 44px;
            margin: 0;
            color: #5009DC;
        }

        .source {
            font-size: 11px;
            color: grey;
            margin: 3px;
        }

        .icon {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 4px;
            margin: 26px auto 20px;
        }

        .icon-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f8f8;
            color: #6b7280;
            font-size: 36px;
            font-weight: bold;
        }

        .description {
            font-size: 14px;
            color: #666;
            margin: 3px;
            line-height: 21px;
        }

        .community-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: auto;
            padding-top: 18px;
        }

        .community-link {
            font-size: 12px;
            line-height: 1.4;
            border: 1px solid #c9b6f5;
            border-radius: 12px;
            padding: 4px 12px;
            background-color: white;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .community-link:hover {
            background-color: #5009DC;
            color: white;
        }

        .empty-state {
            margin: 36px 0;
            color: grey;
        }

        @media (max-width: 720px) {
            body {
                margin: 20px 16px;
            }

            .tab {
                flex-direction: column;
                gap: 0;
            }

            .tab button {
                width: 100%;
                text-align: left;
                margin-bottom: 0;
                border-bottom: 3px solid #e5e7eb;
                border-radius: 0;
            }
        }

        @media (max-width: 360px) {
            .community-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>
<body>
<header>
    <a href="../start/index.html"><img class="site-logo" src="icons/logo.png" alt="CTO Starter Kit"></a>
    <h1>${domain_name}</h1>
    <p class="subtitle">${domain_description}</p>
    <a class="back-link" href="../start/index.html">&larr; CTO Starter Kit</a>
</header>
<main>
    <div class="search-container" id="search_container" role="search" aria-label="Find communities">
        <input id="filter_all" type="search" placeholder="search communities..." aria-label="Search all communities">
        <span id="summary_all" role="status" aria-live="polite"></span>
    </div>
    <div class="tab" id="tab_navigation" role="tablist" aria-label="Regions"></div>
    <div id="tab_content"></div>
    <section id="content_search" aria-label="Search results" hidden></section>
    <noscript><p class="empty-state">Enable JavaScript to browse the communities directory.</p></noscript>
</main>
<script>
    const data = ${communities};
    const availableLogos = new Set(${available_logos});
    const regions = data.regions || [];
    const metadata = data.metadata || {};
    const TAB_STORAGE_KEY = 'cto-starter-kit:communities-active-region';
    const navigation = document.getElementById('tab_navigation');
    const content = document.getElementById('tab_content');
    const searchContent = document.getElementById('content_search');
    const filter = document.getElementById('filter_all');

    function element(tag, className, text) {
        const node = document.createElement(tag);
        node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    }

    function renderCommunity(community, regionName) {
        const card = element('article', 'app');
        const name = community.name || 'Community';
        card.append(element('h2', 'name', name));

        const initials = (name.match(/[\p{L}\p{N}]+/gu) || ['C']).slice(0, 3).map(word => word[0]).join('').toUpperCase();
        const fallback = element('div', 'icon icon-fallback', initials);
        fallback.setAttribute('aria-hidden', 'true');
        if (availableLogos.has(community.logo)) {
            const logo = element('img', 'icon');
            logo.alt = name + ' logo';
            if (community.logoBackground) logo.style.backgroundColor = community.logoBackground;
            logo.addEventListener('error', () => logo.replaceWith(fallback), {once: true});
            logo.src = community.logo;
            card.append(logo);
        } else {
            card.append(fallback);
        }

        card.append(element('p', 'description', community.description || ''));
        const links = element('div', 'community-links');
        (community.links || []).forEach(link => {
            if (!link.url) return;
            const anchor = element('a', 'community-link', link.name || link.url);
            anchor.href = link.url;
            anchor.setAttribute('aria-label', name + ': ' + (link.name || link.url));
            if (metadata.openInNewTab !== false) {
                anchor.target = '_blank';
                anchor.rel = 'noopener noreferrer';
            }
            links.append(anchor);
        });
        card.append(links);
        return card;
    }

    function renderCommunities(entries) {
        if (!entries.length) return element('p', 'empty-state', 'No communities found.');
        const grid = element('div', 'community-grid');
        entries.forEach(entry => grid.append(renderCommunity(entry.community, entry.region)));
        return grid;
    }

    const allCommunities = [];
    regions.forEach((region, index) => {
        const entries = (region.communities || []).map(community => ({
            community: community,
            region: region.name || '',
            searchText: [community.name, community.description, region.name]
                .concat((community.links || []).map(link => [link.name, link.url].join(' ')))
                .join(' ').toLowerCase()
        }));
        allCommunities.push(...entries);

        const button = element('button', 'tablinks', region.name || 'Region');
        button.type = 'button';
        button.id = 'tab_' + index;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-controls', 'region_' + index);
        button.addEventListener('click', () => openTab(index));
        navigation.append(button);

        const panel = element('section', 'tabcontent');
        panel.id = 'region_' + index;
        panel.setAttribute('role', 'tabpanel');
        panel.setAttribute('aria-labelledby', button.id);
        panel.tabIndex = 0;
        panel.append(renderCommunities(entries));
        content.append(panel);
    });

    function openTab(index) {
        Array.from(navigation.children).forEach((button, buttonIndex) => {
            const selected = buttonIndex === index;
            button.classList.toggle('active', selected);
            button.setAttribute('aria-selected', String(selected));
            button.tabIndex = selected ? 0 : -1;
            content.children[buttonIndex].hidden = !selected;
        });
        try {
            sessionStorage.setItem(TAB_STORAGE_KEY, regions[index].name || '');
        } catch (error) { /* Tabs still work when storage is unavailable. */ }
    }

    navigation.addEventListener('keydown', event => {
        const buttons = Array.from(navigation.children);
        let index = buttons.indexOf(event.target);
        if (index < 0) return;
        if (event.key === 'ArrowRight' || event.key === 'ArrowDown') index = (index + 1) % buttons.length;
        else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') index = (index - 1 + buttons.length) % buttons.length;
        else if (event.key === 'Home') index = 0;
        else if (event.key === 'End') index = buttons.length - 1;
        else return;
        event.preventDefault();
        openTab(index);
        buttons[index].focus();
    });

    function update() {
        const query = filter.value.trim().toLowerCase();
        const searching = query.length > 0;
        navigation.hidden = searching || !regions.length;
        content.hidden = searching;
        searchContent.hidden = !searching;
        const matches = searching ? allCommunities.filter(entry => entry.searchText.includes(query)) : [];
        searchContent.replaceChildren(...(searching ? [renderCommunities(matches)] : []));
        document.getElementById('summary_all').textContent = searching
            ? matches.length + ' communit' + (matches.length === 1 ? 'y' : 'ies')
            : '';
    }

    if (regions.length) {
        let selectedIndex = 0;
        try {
            const storedRegion = sessionStorage.getItem(TAB_STORAGE_KEY);
            const storedIndex = regions.findIndex(region => region.name === storedRegion);
            if (storedIndex >= 0) selectedIndex = storedIndex;
        } catch (error) { /* Use the first region when storage is unavailable. */ }
        openTab(selectedIndex);
    } else {
        content.append(element('p', 'empty-state', 'No communities available yet.'));
    }
    document.getElementById('search_container').hidden = metadata.enableSearch === false;
    filter.addEventListener('input', update);
    update();
</script>
</body>
</html>
