<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTO Starter Kit</title>
    <style>
        body {
            font-family: Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
            margin: 40px;
            text-align: center;
        }

        .group {
            display: inline-block;
            border: 1px solid lightgrey;
            border-radius: 6px;
            margin: 8px 18px 8px 8px;
            padding: 5px;
            background-color: #f8f8f8;
        }

        .group-title {
            font-size: 90%;
            margin-top: 4px;
            color: grey;
        }

        .app {
            margin: 10px;
            padding-top: 10px;
            border: solid lightgrey 1px;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.2), 0 3px 10px 0 rgba(0, 0, 0, 0.19);
            display: inline-block;
            height: 320px;
            width: 220px;
            object-fit: cover;
            text-align: center;
            vertical-align: top;
            border-radius: 12px;
            background-color: white;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
            margin-top: 12px;
            color: #5009DC;
            overflow: hidden;
            padding-left: 8px;
            padding-right: 8px;
        }

        .source {
            font-size: 11px;
            color: grey;
            margin: 3px;
        }

        .description {
            font-size: 14px;
            color: grey;
            margin: 3px;
            line-height: 21px;
            padding-left: 8px;
            padding-right: 8px;
        }

        a {
            text-decoration: none;
        }

        .icon {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 4px;
            margin-top: 26px;
            margin-bottom: 20px;
            filter: grayscale(100%);
        }

        .steps-flow {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 12px 0;
        }

        .steps-flow .step-group {
            margin: 0;
            width: 100%;
        }

        .flow-start {
            width: 64px;
            height: 64px;
            line-height: 64px;
            border-radius: 50%;
            background-color: #5009DC;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }

        .flow-line {
            width: 3px;
            height: 36px;
            background-color: #5009DC;
        }

        .step-group {
            vertical-align: top;
            display: flex;
            align-items: flex-start;
            border: 1px solid lightgrey;
            border-radius: 6px;
            margin: 8px auto;
            padding: 0;
            overflow: hidden;
            background-color: #f8f8f8;
            text-align: left;
            max-width: 980px;
        }

        .step-group-logo {
            flex-shrink: 0;
            width: 340px;
            min-height: 340px;
            object-fit: cover;
            align-self: stretch;
            order: 2;
            transition: width 0.2s ease;
        }

        .step-group-content {
            flex: 1;
            min-width: 0;
            padding: 14px 18px;
        }

        .step-group-description {
            font-size: 13px;
            color: grey;
            line-height: 19px;
            margin: -4px 0 12px 0;
        }

        .step-group-title {
            font-weight: bold;
            font-size: 24px;
            color: #5009DC;
            margin-bottom: 10px;
            cursor: pointer;
            user-select: none;
        }

        .step-group-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: -4px 0 12px 0;
        }

        .step-group-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            line-height: 1;
            color: #5009DC;
            border: 1px solid #c9b6f5;
            border-radius: 12px;
            padding: 4px 12px 4px 6px;
            background-color: white;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .step-group-link-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
            border-radius: 3px;
        }

        .step-group-link:hover {
            background-color: #5009DC;
            color: white;
        }

        .step-group-header {
            display: flex;
            align-items: flex-start;
        }

        .step-group-toggle {
            margin-left: auto;
            flex-shrink: 0;
            border: none;
            background: none;
            padding: 2px 6px;
            font-size: 20px;
            line-height: 1;
            color: #5009DC;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .step-group-collapsed .step-group-toggle {
            transform: rotate(-90deg);
        }

        .step-group-collapsed .step {
            display: none;
        }

        /* Collapsed panels keep the image but let it shrink with the panel. */
        .step-group-collapsed .step-group-logo {
            min-height: 0;
            width: 140px;
        }

        .step-group-collapsed .step-group-content > .step-progress {
            margin-bottom: 2px;
        }

        .step {
            display: flex;
            margin: 10px 0;
        }

        .step-number {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            line-height: 26px;
            border-radius: 50%;
            background-color: #5009DC;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-right: 12px;
        }

        .step-body {
            flex: 1;
            min-width: 0;
        }

        .step-icons {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 16px;
            align-self: center;
        }

        .step-done {
            flex-shrink: 0;
            align-self: center;
            margin-left: 16px;
            cursor: pointer;
        }

        .step-done input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #5009DC;
        }

        .step-completed .step-name,
        .step-completed .step-description,
        .step-completed .step-how {
            color: #b5b5b5;
        }

        .step-completed .step-name {
            text-decoration: line-through;
        }

        .step-completed .step-number,
        .step-completed .step-icon {
            opacity: 0.45;
        }

        .step-progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-group .step-progress {
            margin: -2px 0 10px 0;
        }

        .steps-flow > .step-progress {
            margin: 10px 0 2px 0;
        }

        .step-progress-track {
            width: 160px;
            height: 6px;
            border-radius: 3px;
            background-color: #e2e2e2;
            overflow: hidden;
        }

        .steps-flow > .step-progress .step-progress-track {
            width: 260px;
        }

        .step-progress-fill {
            height: 100%;
            width: 0;
            border-radius: 3px;
            background-color: #5009DC;
            transition: width 0.25s ease;
        }

        .step-progress-label {
            font-size: 11px;
            color: grey;
            white-space: nowrap;
        }

        .step-icon {
            max-height: 32px;
            max-width: 32px;
            object-fit: contain;
            border-radius: 4px;
        }

        .step-name {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            line-height: 26px;
        }

        .step-how {
            font-size: 12px;
            font-weight: normal;
            font-style: italic;
            color: grey;
            margin-left: 6px;
        }

        .step-description {
            font-size: 13px;
            color: grey;
            line-height: 19px;
            margin-top: 2px;
        }
    </style>
    <style>
        .tab {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 4px;
        }

        .tab button {
            position: relative;
            background-color: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 11px 16px;
            margin-bottom: -1px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            border-radius: 8px 8px 0 0;
            transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
        }

        .tab button:hover {
            color: #1f2937;
            background-color: #f3f4f6;
        }

        .tab button:focus-visible {
            outline: 2px solid #1d4ed8;
            outline-offset: -2px;
        }

        .tab button.active {
            color: #1d4ed8;
            border-bottom-color: #1d4ed8;
        }

        .tabcontent {
            display: none;
            padding: 2px 2px;
            animation: tabContentFade 0.2s ease;
        }

        @keyframes tabContentFade {
            from {
                opacity: 0;
                transform: translateY(3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 720px) {
            .tab {
                flex-direction: column;
                gap: 0;
            }

            .tab button {
                width: 100%;
                text-align: left;
                margin-bottom: 0;
                border-bottom: 3px solid #e5e7eb;
                border-radius: 0;
            }

            .tab button.active {
                border-bottom-color: #1d4ed8;
            }

            .step-group-logo {
                display: none;
            }
        }
    </style>

    <script>
        const START_TAB_STORAGE_KEY = 'productscape:start-active-tab';

        function initTab() {
            let tabName = '';
            if (typeof apps !== 'undefined' && apps.length > 0) {
                tabName = 'tab_content_' + apps[0].tab;
            }
            const storedTab = window.sessionStorage.getItem(START_TAB_STORAGE_KEY);
            if (storedTab && document.getElementById('tab_' + storedTab)) {
                tabName = storedTab;
            }
            if (tabName) {
                openTab(tabName);
            }
        }

        function openTab(tabName) {
            const tabcontent = document.getElementsByClassName('tabcontent');
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = 'none';
            }
            const tablinks = document.getElementsByClassName('tablinks');
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(' active', '');
            }
            document.getElementById(tabName).style.display = 'block';
            document.getElementById('tab_' + tabName).className += ' active';
            window.sessionStorage.setItem(START_TAB_STORAGE_KEY, tabName);
        }
    </script>

egal risk.", "tools": []}, {"name": "Pay attention to non-product engineering roles", "how": "e.g. TPM, SRE", "description": "These roles hold the org together but are easy to overlook from the top.", "tools": []}]}, {"group": "6. Understand the Technology", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/first-90-days.html#checklist"}], "logo": "images/pexels-servers-5480781.jpg", "steps": [{"name": "Evaluate whether the existing tech stack is effective", "description": "Judge the stack against the business's needs, not your personal preferences.", "tools": []}, {"name": "Identify major friction points", "description": "Daily friction costs more than dramatic incidents; engineers know where it is — ask.", "tools": []}, {"name": "Learn how major technical decisions are made", "description": "Decision paths show whether architecture is designed or accreted.", "tools": []}, {"name": "Build and deploy a small, trivial change yourself", "description": "Nothing reveals the developer experience like living it once.", "tools": []}, {"name": "Join an on-call rotation", "how": "as an observer if needed", "description": "On-call shows the system's real reliability and the toll it takes on people.", "tools": []}, {"name": "Attend incident reviews", "description": "Incident reviews expose both system weaknesses and the culture around failure.", "tools": []}, {"name": "Document the technology history and context behind decisions", "description": "Today's odd architecture is usually yesterday's rational trade-off; know it before judging.", "tools": []}, {"name": "Document the implicit Engineering strategy", "description": "The org already has a strategy in its actions; writing it down is the first step to changing it.", "tools": []}]}, {"group": "7. Understand & Improve Hiring", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/first-90-days.html#checklist"}, {"name": "checklist", "link": "https://docs.google.com/document/d/1BoCi_OYTQztyViv5v4Ihs1JhNWoC3WGAbgk7SpYNjCg/edit?usp=sharing"}], "logo": "images/pexels-interview-5439141.jpg", "steps": [{"name": "Review hiring funnel metrics and pipeline", "description": "The funnel shows whether your problem is sourcing, evaluation, or closing.", "tools": []}, {"name": "Establish a recurring recruiting meeting", "how": "weekly/biweekly", "description": "A standing rhythm keeps hiring moving without your constant attention.", "tools": []}, {"name": "Shadow interviews and onboarding", "description": "Seeing the candidate experience firsthand shows the bar and brand you actually project.", "tools": []}, {"name": "Identify 1–3 highest-priority missing roles", "description": "A short list focuses recruiting capacity where it changes the org's trajectory.", "tools": []}, {"name": "Personally help close top candidates", "description": "For key candidates, an executive call is often what tips the decision.", "tools": []}, {"name": "Evaluate whether the hiring process needs an overhaul", "description": "Decide deliberately whether to fix or rebuild before hiring scales further.", "tools": [{"name": "Interview Framework & Rubric (Senior Software Engineers)", "link": "https://docs.google.com/document/d/1Smc7M5IZndpX2AVa-pn1io-SLQg0MVGwzamcfycUP-4/edit?usp=sharing", "icon": "icons/checklist.png"}, {"name": "Interview Framework & Rubric (Engineering Director)", "link": "https://docs.google.com/document/d/1S-DcmpMPzJtp0InHLqQ5honzUr-xkieG0h15jx7YABI/edit?usp=sharing", "icon": "icons/checklist.png"}]}, {"name": "Kick off Engineering brand efforts", "how": "blog, talks, social presence", "description": "Brand work takes months to pay off, so the seeds go in early.", "tools": []}]}, {"group": "8. Make the Right (Limited) Changes", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/first-90-days.html#checklist"}, {"name": "hidden blocker", "description": "I need it done now (the pull toward fast, visible changes before context is earned)", "link": "https://docs.google.com/document/d/1rLOsAd9MqoTzACD7didiN1dqzUEuqFoUfwjmyxNji0w/edit?usp=sharing", "icon": "icons/unblock.png"}], "logo": "images/pexels-chess-10388905.jpg", "steps": [{"name": "Limit early changes to 1–2 high-leverage improvements", "description": "Few and finished beats many and abandoned — every change spends scarce trust.", "tools": [{"name": "First Things First", "link": "https://docs.google.com/document/d/1HL8ItjQgybo8jaiuLroKLKh0RWWixQwxcRY0YaHqyaU/edit?usp=sharing", "icon": "icons/checklist.png"}, {"name": "Decision-Making Process", "link": "https://docs.google.com/document/d/1WG236vrDdnE_i7oQlpuemSbPC3lXuPa7sYoT98-x3J8/edit?usp=sharing", "icon": "icons/checklist.png"}]}, {"name": "Avoid disrupting systems without a working alternative", "description": "A flawed working system still beats a better one that does not exist yet.", "tools": []}, {"name": "Consider adding a weekly operational review", "description": "One high-leverage change most orgs lack: a regular look at the numbers together.", "tools": []}, {"name": "Evaluate org structure for execution impediments", "description": "Note structural problems now; reorganize only once you understand the people.", "tools": []}, {"name": "Plan next year's org growth", "how": "size, roles, transitions", "description": "Growth planned early avoids reactive hiring and rushed promotions later.", "tools": []}]}, {"group": "9. Learn Through Reflection", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/first-90-days.html#checklist"}, {"name": "hidden blocker", "description": "I know I'm right (first impressions and last-job playbooks treated as answers instead of hypotheses)", "link": "https://docs.google.com/document/d/1IBv5c3exntYuFq7QcAzAucoVjIcjpN81qcztSTut_CA/edit?usp=sharing", "icon": "icons/unblock.png"}], "logo": "images/pexels-notebook-3278757.jpg", "steps": [{"name": "Follow a \"20–40 rule\" for problem-solving before asking for help", "description": "Wrestling with problems yourself builds context; asking after a set time caps the waste.", "tools": []}, {"name": "Create a regular thinking space to slow down", "description": "Unscheduled thinking time is where scattered observations become judgment.", "tools": []}, {"name": "Avoid rushing to judgment without context", "description": "First impressions in a new org are hypotheses to test, not conclusions.", "tools": []}, {"name": "Avoid referencing \"how we did it at my last job\"", "description": "The phrase erodes credibility even when the idea is right; translate, do not cite.", "tools": []}, {"name": "Write down what you're learning", "description": "Writing exposes gaps in your understanding and becomes your strategy's raw material.", "tools": []}]}, {"group": "10. Build External Support", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/first-90-days.html#checklist"}], "logo": "images/pexels-climbers-2609459.jpg", "steps": [{"name": "Build a peer support group of similar leaders", "description": "Some problems can only be discussed with peers outside your company.", "tools": [{"name": "CTO Craft", "link": "https://ctocraft.com/", "icon": "icons/cto-craft.png"}, {"name": "Chief Architect leaders", "link": "https://chiefarchitectnetwork.com/", "icon": "icons/can.png"}]}, {"name": "Consider engaging an executive coach", "description": "A coach provides the candid, disinterested feedback your org cannot give you.", "tools": []}, {"name": "Create space for self-care", "how": "sleep, exercise, therapy, hobbies", "description": "The role is a marathon; recovery capacity is part of the job.", "tools": []}]}, {"group": "11. Protect Long-Term Sustainability", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/first-90-days.html#checklist"}, {"name": "hidden blocker", "description": "I need it done now (self-worth tied solely to output and accomplishment — the root of unsustainable pace)", "link": "https://docs.google.com/document/d/1rLOsAd9MqoTzACD7didiN1dqzUEuqFoUfwjmyxNji0w/edit?usp=sharing", "icon": "icons/unblock.png"}], "logo": "images/pexels-stones-289586.jpg", "steps": [{"name": "Assess whether team pace is sustainable", "description": "A pace that needs heroics is not a pace; it is a countdown to attrition.", "tools": []}, {"name": "Identify energy drains", "how": "for you and the team", "description": "Naming the drains is the prerequisite to removing them.", "tools": []}, {"name": "Add energizing practices deliberately", "description": "Energy is managed by design, not by waiting for a quieter quarter.", "tools": []}, {"name": "Avoid burnout cycles early", "description": "Burnout patterns set in the first months tend to become the permanent culture.", "tools": []}]}]}, {"tab": "First Year", "steps": [{"group": "Turn Learning into Direction", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/index.html"}], "logo": "images/pexels-signpost-14697954.jpg", "description": "Engineering Executive: Months 4–12. Convert the diagnosis from your first quarter into strategy, systems, and a team you trust — every step below follows from these principles.", "steps": [{"name": "Convert your 90-day diagnosis into a written strategy", "description": "Your first-quarter learning only pays off once it becomes explicit direction others can act on.", "tools": []}, {"name": "Build key operating systems that run without you in the room", "description": "Hiring, planning, and meetings should work through owners and cadences, not your constant presence.", "tools": [{"name": "Blocker: I need to be involved", "link": "https://docs.google.com/document/d/1fsmrClrhM17S7LrmUdYS207RYQ6Xl_HKK3nzDuxBFlc/edit?usp=sharing", "icon": "icons/unblock.png"}]}, {"name": "Limit concurrent major initiatives — finish and prove value before starting more", "description": "A few completed, visible wins build more trust than many half-finished changes.", "tools": []}, {"name": "Separate decisions: financial plan first, then allocation, then roadmap", "description": "Debating everything at once creates chaos; sequencing keeps each debate small and resolvable.", "tools": []}, {"name": "Keep durable constraints steady; change narrowly and intentionally", "description": "Stable budgets and allocations let teams plan; when change is needed, change one thing with a stated reason.", "tools": []}]}, {"group": "1. Write the Engineering Strategy", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/engineering-strategy.html"}, {"name": "checklist", "link": "https://docs.google.com/document/d/1xYlAREdlXgxSZNeHYjv7phydWM-q59wds_5oDhFLRiY/edit?usp=sharing"}], "logo": "images/pexels-lighthouse-1535162.jpg", "description": "Months 4–6.", "steps": [{"name": "Write the strategy document yourself", "how": "diagnosis → guiding policies → coherent actions", "description": "Delegating the writing signals delegated ownership; the diagnosis and trade-offs must be yours.", "tools": [{"name": "Engineering Strategy Basics", "link": "https://docs.google.com/document/d/1LJvEVv4oAetnxvnCcPCQIJK2JgIEy58q1liAIvgz_3Y/edit?usp=sharing", "icon": "icons/checklist.png"}]}, {"name": "Build the diagnosis from the roadmap, financials, and survey data; validate it with skeptics", "description": "A strategy built on a wrong diagnosis fails no matter how good the policies are.", "tools": [{"name": "Strategy Exploration", "link": "https://docs.google.com/document/d/125ZAVdCTn-OitPL5CntTEDBJip-PLwyorVxPJi6s2_I/edit?usp=sharing", "icon": "icons/checklist.png"}, {"name": "Strategy Diagnosis", "link": "https://docs.google.com/document/d/13hj3Hfrlk4zV8cO3vlsMAh7gqQrYgOYOUE72DcGDva8/edit?usp=sharing", "icon": "icons/checklist.png"}]}, {"name": "Document resource allocation, fundamental rules, and decision rights explicitly", "description": "These three policy areas decide most day-to-day conflicts before they reach you.", "tools": [{"name": "Strategy Policy Setting", "link": "https://docs.google.com/document/d/1zptVA0CmaG8_PGcB8PeUHhDMRGl7HWQhvshY6SS1Jus/edit?usp=sharing", "icon": "icons/checklist.png"}]}, {"name": "Test every policy against three checks", "how": "applicable, enforced, leverage-creating", "description": "A policy that fails any of the three checks is a slogan, not a strategy.", "tools": [{"name": "Strategy Refining", "link": "https://docs.google.com/document/d/1Oc74GoYPQtKchY9fAC2RoHKqbsUwmCk5z3UDWP5KXhY/edit?usp=sharing", "icon": "icons/checklist.png"}]}, {"name": "Iterate drafts with a working group of 3–5 trusted stakeholders before socializing widely", "description": "Early private iteration surfaces flaws cheaply and creates allies for the launch.", "tools": [{"name": "Strategy Style Guide", "link": "https://docs.google.com/document/d/1-y9q4hToDZBZgOu-e9YyyfsK1z0YEMOKNAX4M6Wu1EA/edit?usp=sharing", "icon": "icons/checklist.png"}]}, {"name": "Launch with a ~1-week feedback window; review impact after ~2 months; refresh annually", "description": "A defined feedback and review rhythm keeps the strategy alive instead of shelfware.", "tools": [{"name": "Strategy Operations", "link": "https://docs.google.com/document/d/1l0qxkXiR9s7fv6dK6ckOUIdZrUzVweB_tabqVjhfwJ4/edit?usp=sharing", "icon": "icons/checklist.png"}]}, {"name": "If company strategy is undocumented, write down your best understanding of it", "description": "Engineering strategy must anchor to something; even an informal summary beats guessing.", "tools": []}]}, {"group": "2. Run Deliberate Planning & Budgeting", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/planning.html"}], "logo": "images/pexels-calculator-209224.jpg", "description": "Aligned with the fiscal-year cycle.", "steps": [{"name": "Run planning as three separated phases", "how": "financial plan → portfolio allocation → roadmap", "description": "Each phase settles constraints for the next, keeping debates small and decisions durable.", "tools": []}, {"name": "Segment costs into headcount, production, and development", "how": "with Finance", "description": "Different cost types grow for different reasons and need different levers.", "tools": []}, {"name": "Model the org structure before requesting headcount; check the plan against recruiting capacity", "description": "Headcount you can't recruit or absorb is a plan on paper only.", "tools": []}, {"name": "Set steady allocation percentages and keep them stable", "how": "e.g. product / infra / dev-ex", "description": "Steady allocation lets teams commit; constant rebalancing destroys momentum.", "tools": []}, {"name": "Reserve a fixed validation budget for exploratory work", "description": "Unscoped ideas need a protected lane; never compare their raw potential against scoped work.", "tools": []}, {"name": "Agree the roadmap in open sessions with Product and Design — outcomes first, projects second", "description": "Open sessions prevent 1:1 side deals; outcome framing leaves teams room to solve.", "tools": []}, {"name": "List vendor renewal deadlines for the year; check usage vs. contract before each negotiation", "description": "Leverage in vendor negotiations comes from time and usage data, not urgency.", "tools": []}]}, {"group": "3. Measure What You Will Use", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/measuring-engineering-organizations.html"}], "logo": "images/pexels-measuring-tape-5383194.jpg", "steps": [{"name": "Run one measurement initiative at a time; start with metrics that feed real decisions", "description": "Small, useful wins build trust in data; a big measurement program invites resistance.", "tools": []}, {"name": "Stand up operational metrics", "how": "incidents, downtime, latency, cost per business metric", "description": "These are the health signals customers and the board will ask about first.", "tools": []}, {"name": "Instrument delivery lead time and deployment frequency; survey developer experience", "how": "e.g. SPACE", "description": "System metrics show throughput; survey data shows the friction behind it.", "tools": []}, {"name": "Set an explicit rule with managers: optimization metrics improve systems, never rate individuals", "description": "The moment metrics judge people, people start gaming the metrics.", "tools": []}, {"name": "Agree one clear goal with the CEO and board, tied to business strategy, and report against it", "description": "One legible goal beats a dashboard of engineering internals nobody upstairs can parse.", "tools": []}, {"name": "Review the data weekly; compare month-over-month and quarter-over-quarter trends", "description": "Regular review builds intuition for what is normal, so anomalies stand out early.", "tools": []}]}, {"group": "4. Gel Your Leadership Team", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/gelling-your-engineering-leadership-team.html"}], "logo": "images/pexels-rowing-3754647.jpg", "steps": [{"name": "Decide who is on the long-term team; make personnel changes quickly", "description": "Slow personnel decisions freeze team dynamics; clarity resets them.", "tools": []}, {"name": "Write down how the team decides, disagrees, and escalates; call out violations immediately", "description": "Values only exist if defection is refereed consistently — for everyone.", "tools": []}, {"name": "Establish team rituals", "how": "weekly leadership meeting, update cadence, escalation paths", "description": "Predictable structure carries information and decisions without depending on heroics.", "tools": []}, {"name": "Set explicit expectations: every leader builds a strong team and works peer-to-peer, not in silos", "description": "You are building leaders of leaders; escalated peer conflicts should be exceptions.", "tools": []}, {"name": "Write a personal README covering your working style and decision philosophy", "description": "The team wastes months guessing how to work with you; write it down instead.", "tools": [{"name": "Working With Me template", "link": "https://docs.google.com/document/d/1TQHPjAPfLoAu6ohva9rXO2JMyxrHgLr9F-poLJz9G1I/edit?usp=sharing", "icon": "icons/templates.png"}, {"name": "Working With Me example", "link": "https://docs.google.com/document/d/1zgpqDtUhH0xnKHZVtnBWqBxwgL5WbEU1QSDmmt_hrr0/edit?usp=sharing", "icon": "icons/docs.png"}]}, {"name": "Address signs of peer competition in 1:1s before they harden", "description": "Competition for scope turns a leadership team zero-sum; name it early.", "tools": []}]}, {"group": "5. Establish the Operating Cadence", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/meetings.html"}], "logo": "images/pexels-metronome-7220729.jpg", "steps": [{"name": "Require a written document — not slides — for every recurring review meeting", "description": "Documents force clear thinking and let the meeting be discussion, not presentation.", "tools": []}, {"name": "Schedule the weekly core: leadership meeting, tech spec review, incident review", "description": "These three carry execution, technical quality, and learning from failure.", "tools": []}, {"name": "Add the monthly forums: managers meeting, Staff+ meeting, org-wide Q&A", "description": "Monthly forums develop leaders and give everyone direct access to you.", "tools": []}, {"name": "Hold weekly 1:1s with directs; cap skip-levels at a fixed time budget", "how": "e.g. 1–2 hours/week", "description": "1:1s are the primary support channel; the cap keeps skip-levels from crowding out core work.", "tools": []}, {"name": "Assign an owner to every recurring meeting; cancel any that stop adding value", "description": "Ownerless meetings decay into ritual; each should survive a 'would we cancel this?' test.", "tools": []}]}, {"group": "6. Communicate Predictably", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/internal-communication.html"}], "logo": "images/pexels-megaphone-3851254.jpg", "steps": [{"name": "Send a short, predictable update to the org even in quiet weeks", "how": "weekly or biweekly", "description": "The steady drip builds trust and makes big announcements land in context.", "tools": []}, {"name": "Package every big announcement", "how": "tl;dr, who is affected, actions, dates, canonical source", "description": "A standard packet ensures nobody misses what changed, who is affected, and what to do.", "tools": []}, {"name": "Have a trusted reviewer read significant messages before you broadcast them", "description": "A reviewer catches confusing wording, unintended tone, and missing context cheaply.", "tools": []}, {"name": "Repeat major messages across every channel", "how": "email, chat, team meetings, all-hands", "description": "Nobody reads every channel; repetition is how a message actually reaches the org.", "tools": []}, {"name": "Before replying to executive feedback, restate the underlying concern and confirm you got it right", "description": "Feedback often carries a deeper worry — speed, risk, priority; answer that, not the surface detail.", "tools": []}]}, {"group": "7. Build the Hiring Machine", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/hiring.html"}], "logo": "images/pexels-join-team-3127883.jpg", "steps": [{"name": "Document hiring loops, interview rubrics, and a written leveling framework", "description": "Documentation turns hiring from personal heroics into a system others can run.", "tools": []}, {"name": "Standardize compensation with clear in-band / out-of-band approval rules", "description": "Consistent offers protect fairness and stop every negotiation escalating to you.", "tools": []}, {"name": "Review monthly metrics", "how": "hires per recruiter, time to hire, offer and acceptance rates", "description": "A monthly look at the funnel shows where the machine is jammed before quarters are lost.", "tools": []}, {"name": "Keep time-to-offer within ~2 weeks; require a high bar for adding interview steps", "description": "Speed wins candidates; every added step costs more than the signal it usually adds.", "tools": []}, {"name": "Join sell calls to personally help close senior and strategic candidates", "description": "Executive attention is often the deciding factor for senior hires.", "tools": []}, {"name": "Train hiring managers; set decision deadlines and intervene on unicorn requirements", "description": "Most hiring failures are manager behaviors — indecision, impossible requirements — not pipeline problems.", "tools": []}]}, {"group": "8. Launch Engineering Onboarding", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/engineering-onboarding.html"}], "logo": "images/pexels-open-door-8276599.jpg", "steps": [{"name": "Appoint an onboarding orchestrator with real time allocated", "how": "≥20 hours/month", "description": "Without a named owner with real hours, onboarding decays into a slide deck.", "tools": []}, {"name": "Start with three sessions: values & strategy, architecture overview, dev-environment setup", "description": "The worst programs come from trying too hard; start simple and practical.", "tools": []}, {"name": "Give every new hire a buddy and a personalized team-level plan", "description": "Daily buddy check-ins in the first weeks catch friction the manager never sees.", "tools": []}, {"name": "Measure time-to-productivity and satisfaction; survey new hires after 1 month", "description": "Fresh hires see your org's gaps most clearly — capture that before it fades.", "tools": []}, {"name": "Review results and iterate quarterly; scale the investment to your hiring rate", "description": "A structured program pays off around 5–10 hires/month; below that, keep it lightweight.", "tools": []}]}, {"group": "9. Define Values & Calibrate Standards", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/organizational-values.html"}, {"name": "hidden blocker", "description": "If I can do it, so can you (what worked for you should work for everyone — the trap behind mismatched standards)", "link": "https://docs.google.com/document/d/196yZ0RS-FYR14O0w6kKfQQoFj1yvaj-2EDts4W-PPDQ/edit?usp=sharing", "icon": "icons/unblock.png"}], "logo": "images/pexels-scale-6077961.jpg", "steps": [{"name": "Test every proposed value: reversible, applicable, honest", "description": "A good value is a real choice another company could invert, usable in trade-offs, and true today.", "tools": []}, {"name": "Drop values that describe aspiration, not today's behavior — change behavior first, then write it down", "description": "Aspirational values read as hypocrisy; documented reality builds credibility.", "tools": []}, {"name": "Pilot values with small groups, then integrate them into hiring, promotions, and 1:1s", "description": "Values that never appear in decisions and promotions are just posters.", "tools": []}, {"name": "List where your personal standards exceed what the org supports; pick the few gaps worth the fight", "description": "Silently compensating for standards nobody shares is the fast path to burnout.", "tools": []}, {"name": "Spread higher standards in three steps", "how": "model one practice visibly → document it → offer it to teams", "description": "Role modeling spreads standards further than mandates — and shows which teams opt in.", "tools": []}]}, {"group": "10. Secure Executive Support", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/working-with-your-ceo-peers-and-engineering.html"}], "logo": "images/pexels-bridge-1485894.jpg", "steps": [{"name": "Rate each peer relationship — supported, tolerated, or resented — and book 1:1s where it isn't “supported”", "description": "You cannot succeed while merely tolerated; name the weak relationships and work them.", "tools": []}, {"name": "When a peer criticizes Engineering, verify the claim with your team before acting on it", "description": "Criticism is often a symptom of a broader issue; fix the root cause, not the accusation.", "tools": []}, {"name": "When functions clash, write down each side's view and propose one company-first synthesis", "description": "The integrating narrative is usually yours to write; function-first framing loses allies.", "tools": []}, {"name": "After exec meetings, ask one peer: “what could I have done better?”", "description": "Small, specific feedback requests build the alignment habit and show visible improvement.", "tools": []}, {"name": "Resolve stuck disagreements with structured escalation", "how": "agree to resolve within 5 days", "description": "A time-boxed process converts endless re-litigating into a decision everyone commits to.", "tools": []}, {"name": "Filter major decisions with: “what maximizes company impact over the next 3 years?”", "description": "The long-horizon test separates company-first calls from turf defense.", "tools": []}]}]}, {"tab": "Long Term", "steps": [{"group": "Lead for the Long Run", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/index.html"}], "logo": "images/pexels-road-19708273.jpg", "description": "Engineering Executive: Year 2 and beyond. Shift from building omes", "description": "Punishing good errors and rewarding bad successes optimizes for luck.", "tools": [{"name": "Blocker: I can't make a mistake", "link": "https://docs.google.com/document/d/157WEHG6WK-kEkd6UrLehCBYWrKPq6m56p8XA4RdsRjM/edit?usp=sharing", "icon": "icons/unblock.png"}]}, {"name": "Run weekly or monthly metric forums; don't rely on quarterly-only reviews", "description": "Quarterly-only reviews find problems a quarter late.", "tools": []}, {"name": "When a concern surfaces, go directly to the people doing the work", "how": "learning spikes", "description": "Summarized narratives filter out exactly the context you need.", "tools": []}, {"name": "Chase down confusing reports or metrics immediately — persistent confusion is a trust risk", "description": "Ambiguity compounds; what confuses you today misleads decisions tomorrow.", "tools": []}, {"name": "Invite others to inspect your own work; run a quarterly self-check on where you rely on trust alone", "description": "Reciprocal inspection proves it is support, not suspicion.", "tools": []}]}, {"group": "2. Master All Three Leadership Styles", "links": [{"name": "guide", "link": "https://zeljkoobrenovic.github.io/spec-driven-journals/grounded-engineering-executive/leadership-styles.html"}, {"name": "checklist", "link": "https://docs.google.com/document/d/1VieSR1aAuYXBWLTx0pBo3ciVP1jSls9J6clv1QiK_tk/edit?usp=sharing"}, {"name": "hidden blocker", "description": "I know I'm right (defaulting to conviction because you believe you hold the answers)", "link": "https://docs.google.com/document/d/1IBv5c3exntYuFq7QcAzAucoVjIcjpN81qcztSTut_CA/edit?usp=sharing", "icon": "icons/unblock.png"}], "logo": "images/pexels-conductor-12240911.jpg", "steps": [{"name": "Use policy for recurring decisions that need consistency", "how": "codify → validate → roll out → review", "description": "Written policy lets the organization move without you in the room.", "tools": []}, {"name": "Use consensus when context is distributed a <script>
    // Pre-build a flat list with pre-lowercased fields for search
    const allApps = [];
    apps.forEach(tab => {

        (tab.apps || []).forEach(group => {
            (group.apps || []).forEach(app => {
                allApps.push({
                    app: app,
                    name: (app.name || '').toLowerCase(),
                    description: (app.description || '').toLowerCase(),
                    source: (app.source || '').toLowerCase()
                });
            });
        });
    });

    function renderAppCard(app) {
        let html = '<div class="app">';
        if (config.openInNewTab === false || app.openInNewTab === false) {
            html += '<a href="' + app.link + '">';
        } else {
            html += '<a target="_blank" href="' + app.link + '">';
        }
        html += '<div style="height: 38px">';
        html += '<div class="name">' + app.name + '</div>';
        if (app.source) {
            html += '<div class="source">source: ' + app.source + '</div>';
        } else {
            html += '<div class="source"></div>';
        }
        html += '</div>';
        html += '<div><img class="icon" src="' + app.icon + '"></div>';
        html += '<div class="description">' + app.description + '</div>';
        html += '</a>';
        html += '</div>';
        return html;
    }

    // Done-state of a step lives in localStorage, keyed by tab + group + step
    // name. The stored value ('1'/'0') wins; without one, the step's `done`
    // field from apps.json is the initial value (undefined = unchecked).
    function escapeAttr(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function stepDoneKey(tabName, groupTitle, step) {
        return 'step-done::' + tabName + '::' + groupTitle + '::' + (step.name || '');
    }

    function isStepDone(key, step) {
        try {
            const stored = localStorage.getItem(key);
            if (stored === '1') return true;
            if (stored === '0') return false;
        } catch (e) { /* storage unavailable — fall back to config value */
        }
        return step.done === true;
    }

    document.addEventListener('change', function (e) {
        const box = e.target;
        if (!box.classList || !box.classList.contains('step-done-checkbox')) return;
        try {
            localStorage.setItem(decodeURIComponent(box.getAttribute('data-key')), box.checked ? '1' : '0');
        } catch (err) { /* storage unavailable — checkbox still toggles for this view */
        }
        const stepEl = box.closest('.step');
        if (stepEl) stepEl.classList.toggle('step-completed', box.checked);
        refreshStepProgress();
    });

    // Recompute every progress bar from the current checkbox states. A bar
    // scoped "group" counts within its .step-group panel; a bar scoped "flow"
    // counts every step of its whole .steps-flow.
    function refreshStepProgress() {
        document.querySelectorAll('.step-progress').forEach(function (el) {
            const scope = el.closest(el.getAttribute('data-scope') === 'flow' ? '.steps-flow' : '.step-group');
            if (!scope) return;
            const boxes = scope.querySelectorAll('.step-done-checkbox');
            let done = 0;
            boxes.forEach(function (b) {
                if (b.checked) done++;
            });
            const pct = boxes.length ? Math.round(done * 100 / boxes.length) : 0;
            el.querySelector('.step-progress-fill').style.width = pct + '%';
            el.querySelector('.step-progress-label').textContent = done + ' / ' + boxes.length + ' done';
        });
    }

    // Collapsed-state of a step-group lives in localStorage, keyed by tab +
    // group title. The stored value ('1'/'0') wins; without one, the group's
    // `collapsed` field from apps.json is the initial value (undefined = open).
    function groupCollapseKey(tabName, groupTitle) {
        return 'group-collapsed::' + tabName + '::' + groupTitle;
    }

    function isGroupCollapsed(key, stepGroup) {
        try {
            const stored = localStorage.getItem(key);
            if (stored === '1') return true;
            if (stored === '0') return false;
        } catch (e) { /* storage unavailable — fall back to config value */
        }
        return stepGroup.collapsed === true;
    }

    // Both the chevron button and the group title toggle the collapse.
    document.addEventListener('click', function (e) {
        const trigger = e.target && e.target.closest ? e.target.closest('.step-group-toggle, .step-group-title') : null;
        if (!trigger) return;
        const groupEl = trigger.closest('.step-group');
        if (!groupEl) return;
        const btn = groupEl.querySelector('.step-group-toggle');
        if (!btn) return;
        const collapsed = groupEl.classList.toggle('step-group-collapsed');
        try {
            localStorage.setItem(decodeURIComponent(btn.getAttribute('data-key')), collapsed ? '1' : '0');
        } catch (err) { /* storage unavailable — toggle still works for this view */
        }
    });

    function stepProgressHtml(scope) {
        return '<div class="step-progress" data-scope="' + scope + '">' +
            '<div class="step-progress-track"><div class="step-progress-fill"></div></div>' +
            '<span class="step-progress-label"></span>' +
            '</div>';
    }

    function renderStepGroup(stepGroup, tabName) {
        const newTab = !(config.openInNewTab === false);
        const title = stepGroup.group || '';
        const collapseKey = groupCollapseKey(tabName, title);
        const collapsed = isGroupCollapsed(collapseKey, stepGroup);
        let html = '<div class="step-group' + (collapsed ? ' step-group-collapsed' : '') + '">';
        const groupLogo = stepGroup.logo || stepGroup.icon;
        if (groupLogo) {
            html += '<img class="step-group-logo" src="' + groupLogo + '">';
        }
        html += '<div class="step-group-content">';
        html += '<div class="step-group-header">';
        html += '<div class="step-group-title" title="Collapse / expand this section">' + title + '</div>';
        html += '<button class="step-group-toggle" type="button" data-key="' + encodeURIComponent(collapseKey) + '" title="Collapse / expand this section">&#9662;</button>';
        html += '</div>';
        // `links` is [{name, link, icon, description}] (legacy {label, href}
        // still accepted); a legacy string `link` becomes one chip. Missing
        // icons fall back to icons/link.png; `description` shows on mouse over.
        const groupLinks = stepGroup.links || (stepGroup.link ? [{name: 'guide', link: stepGroup.link}] : []);
        if (groupLinks.length) {
            html += '<div class="step-group-links">';
            groupLinks.forEach(l => {
                const linkHref = l.link || l.href;
                const linkName = l.name || l.label || linkHref;
                const linkIcon = l.icon || 'icons/link.png';
                const linkTip = l.description ? ' title="' + escapeAttr(l.description) + '"' : '';
                html += '<a class="step-group-link" ' + (newTab ? 'target="_blank" ' : '') + 'href="' + linkHref + '"' + linkTip + '>' +
                    '<img class="step-group-link-icon" src="' + linkIcon + '" onerror="this.src=\'icons/link.png\'; this.onerror=null;" alt="">' +
                    escapeAttr(linkName) + '</a>';
            });
            html += '</div>';
        }
        if (stepGroup.description) {
            html += '<div class="step-group-description">' + stepGroup.description + '</div>';
        }
        if ((stepGroup.steps || []).length) {
            html += stepProgressHtml('group');
        }
        (stepGroup.steps || []).forEach((step, index) => {
            const doneKey = stepDoneKey(tabName, title, step);
            const done = isStepDone(doneKey, step);
            html += '<div class="step' + (done ? ' step-completed' : '') + '">';
            html += '<div class="step-number">' + (index + 1) + '</div>';
            html += '<div class="step-body">';
            html += '<div class="step-name">' + (step.name || '');
            if (step.how) {
                html += '<span class="step-how">' + step.how + '</span>';
            }
            html += '</div>';
            if (step.description) {
                html += '<div class="step-description">' + step.description + '</div>';
            }
            html += '</div>';
            const stepTools = step.tools || step.icons || (step.icon ? [step.icon] : []);
            if (stepTools.length) {
                html += '<div class="step-icons">';
                stepTools.forEach(tool => {
                    const isToolObject = tool !== null && typeof tool === 'object';
                    const iconSrc = isToolObject ? tool.icon : tool;
                    const tipParts = [];
                    if (isToolObject && tool.name) tipParts.push(tool.name);
                    if (isToolObject && tool.description) tipParts.push(tool.description);
                    const tip = tipParts.length ? ' title="' + escapeAttr(tipParts.join(' — ')) + '"' : '';
                    const alt = isToolObject && tool.name ? ' alt="' + escapeAttr(tool.name) + '"' : '';
                    const iconImg = '<img class="step-icon"' + tip + alt + ' src="' + iconSrc + '">';
                    if (isToolObject && tool.link) {
                        html += '<a target="_blank" href="' + tool.link + '"' + tip + '>' + iconImg + '</a>';
                    } else {
                        html += iconImg;
                    }
                });
                html += '</div>';
            }
            html += '<label class="step-done" title="Mark step as done">';
            html += '<input type="checkbox" class="step-done-checkbox" data-key="' + encodeURIComponent(doneKey) + '"' + (done ? ' checked' : '') + '>';
            html += '</label>';
            html += '</div>';
        });
        html += '</div>';
        html += '</div>';
        return html;
    }

    function renderTabs() {
        apps.forEach(tab => {
            let html = '';
            (tab.apps || []).forEach(group => {
                html += '<div class="group">';
                html += '<div class="group-title">' + group.group + '</div>';
                (group.apps || []).forEach(app => {
                    html += renderAppCard(app);
                });
                html += '</div>';
            });
            if (tab.steps && tab.steps.length) {
                html += '<div class="steps-flow">';
                html += '<div class="flow-start">&nbsp;</div>';
                html += stepProgressHtml('flow');
                tab.steps.forEach(stepGroup => {
                    html += '<div class="flow-line"></div>';
                    html += renderStepGroup(stepGroup, tab.tab);
                });
                html += '</div>';
            }
            document.getElementById('content_' + tab.tab).innerHTML = html;
        });
        refreshStepProgress();
    }

    function update() {
        const filterText = document.getElementById('filter_all').value.trim().toLowerCase();

        if (filterText) {
            document.getElementById('tab_navigation').style.display = 'none';
            document.getElementById('tab_content').style.display = 'none';
            document.getElementById('content_search').style.display = 'block';

            let html = '';
            let count = 0;
            allApps.forEach(entry => {
                if (entry.name.includes(filterText) || entry.description.includes(filterText) || entry.source.includes(filterText)) {
                    html += renderAppCard(entry.app);
                    count++;
                }
            });
            document.getElementById('content_search').innerHTML = html;
            document.getElementById('summary_all').innerHTML = ' = ' + count + ' app' + (count !== 1 ? 's' : '');
        } else {
            document.getElementById('tab_navigation').style.display = '';
            document.getElementById('tab_content').style.display = '';
            document.getElementById('content_search').style.display = 'none';
            document.getElementById('summary_all').innerHTML = '';
        }
    }

    if (!config || !config.enableSearch) {
        document.getElementById('search_container').style.display = 'none';
    }

    renderTabs();
</script>
</body>
</html>
