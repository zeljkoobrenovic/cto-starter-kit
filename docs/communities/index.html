    const regions = data.regions || [];
    const metadata = data.metadata || {};
    const TAB_STORAGE_KEY = 'cto-starter-kit:communities-active-region';
    const navigation = document.getElementById('tab_navigation');
    const content = document.getElementById('tab_content');
    const searchContent = document.getElementById('content_search');
    const filter = document.getElementById('filter_all');

    function element(tag, className, text) {
        const node = document.createElement(tag);
        node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    }

    function renderCommunity(community, regionName) {
        const card = element('article', 'app');
        const name = community.name || 'Community';
        card.append(element('h2', 'name', name));

        const initials = (name.match(/[\p{L}\p{N}]+/gu) || ['C']).slice(0, 3).map(word => word[0]).join('').toUpperCase();
        const fallback = element('div', 'icon icon-fallback', initials);
        fallback.setAttribute('aria-hidden', 'true');
        if (availableLogos.has(community.logo)) {
            const logo = element('img', 'icon');
            logo.alt = name + ' logo';
            if (community.logoBackground) logo.style.backgroundColor = community.logoBackground;
            logo.addEventListener('error', () => logo.replaceWith(fallback), {once: true});
            logo.src = community.logo;
            card.append(logo);
        } else {
            card.append(fallback);
        }

        card.append(element('p', 'description', community.description || ''));
        const links = element('div', 'community-links');
        (community.links || []).forEach(link => {
            if (!link.url) return;
            const anchor = element('a', 'community-link', link.name || link.url);
            anchor.href = link.url;
            anchor.setAttribute('aria-label', name + ': ' + (link.name || link.url));
            if (metadata.openInNewTab !== false) {
                anchor.target = '_blank';
                anchor.rel = 'noopener noreferrer';
            }
            links.append(anchor);
        });
        card.append(links);
        return card;
    }

    function renderCommunities(entries) {
        if (!entries.length) return element('p', 'empty-state', 'No communities found.');
        const grid = element('div', 'community-grid');
        entries.forEach(entry => grid.append(renderCommunity(entry.community, entry.region)));
        return grid;
    }

    const allCommunities = [];
    regions.forEach((region, index) => {
        const entries = (region.communities || []).map(community => ({
            community: community,
            region: region.name || '',
            searchText: [community.name, community.description, region.name]
                .concat((community.links || []).map(link => [link.name, link.url].join(' ')))
                .join(' ').toLowerCase()
        }));
        allCommunities.push(...entries);

        const button = element('button', 'tablinks', region.name || 'Region');
        button.type = 'button';
        button.id = 'tab_' + index;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-controls', 'region_' + index);
        button.addEventListener('click', () => openTab(index));
        navigation.append(button);

        const panel = element('section', 'tabcontent');
        panel.id = 'region_' + index;
        panel.setAttribute('role', 'tabpanel');
        panel.setAttribute('aria-labelledby', button.id);
        panel.tabIndex = 0;
        panel.append(renderCommunities(entries));
        content.append(panel);
    });

    function openTab(index) {
        Array.from(navigation.children).forEach((button, buttonIndex) => {
            const selected = buttonIndex === index;
            button.classList.toggle('active', selected);
            button.setAttribute('aria-selected', String(selected));
            button.tabIndex = selected ? 0 : -1;
            content.children[buttonIndex].hidden = !selected;
        });
        try {
            sessionStorage.setItem(TAB_STORAGE_KEY, regions[index].name || '');
        } catch (error) { /* Tabs still work when storage is unavailable. */ }
    }

    navigation.addEventListener('keydown', event => {
        const buttons = Array.from(navigation.children);
        let index = buttons.indexOf(event.target);
        if (index < 0) return;
        if (event.key === 'ArrowRight' || event.key === 'ArrowDown') index = (index + 1) % buttons.length;
        else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') index = (index - 1 + buttons.length) % buttons.length;
        else if (event.key === 'Home') index = 0;
        else if (event.key === 'End') index = buttons.length - 1;
        else return;
        event.preventDefault();
        openTab(index);
        buttons[index].focus();
    });

    function update() {
        const query = filter.value.trim().toLowerCase();
        const searching = query.length > 0;
        navigation.hidden = searching || !regions.length;
        content.hidden = searching;
        searchContent.hidden = !searching;
        const matches = searching ? allCommunities.filter(entry => entry.searchText.includes(query)) : [];
        searchContent.replaceChildren(...(searching ? [renderCommunities(matches)] : []));
        document.getElementById('summary_all').textContent = searching
            ? matches.length + ' communit' + (matches.length === 1 ? 'y' : 'ies')
            : '';
    }

    if (regions.length) {
        let selectedIndex = 0;
        try {
            const storedRegion = sessionStorage.getItem(TAB_STORAGE_KEY);
            const storedIndex = regions.findIndex(region => region.name === storedRegion);
            if (storedIndex >= 0) selectedIndex = storedIndex;
        } catch (error) { /* Use the first region when storage is unavailable. */ }
        openTab(selectedIndex);
    } else {
        content.append(element('p', 'empty-state', 'No communities available yet.'));
    }
    document.getElementById('search_container').hidden = metadata.enableSearch === false;
    filter.addEventListener('input', update);
    update();
</script>
